name: BMS Ticket Checker

on:
  # Run every hour at minute 0
  schedule:
    - cron: '0 * * * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # Restore state file from previous run (if any)
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: bms_state.json
          key: bms-state-${{ github.ref }}
          restore-keys: |
            bms-state-

      - name: Run BMS Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BMS_MOVIE_URL: ${{ vars.BMS_MOVIE_URL }}
          BMS_THEATRE_NAME: ${{ vars.BMS_THEATRE_NAME }}
          BMS_TARGET_DATE: ${{ vars.BMS_TARGET_DATE }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          if [ -f "targets.json" ]; then
            echo "targets.json found. Running multi-target mode..."
            python bms_checker.py --targets targets.json
          else
            echo "targets.json not found. Running single-target mode from variables..."
            python bms_checker.py \
              --movie-url "$BMS_MOVIE_URL" \
              --theatre "$BMS_THEATRE_NAME" \
              --date "$BMS_TARGET_DATE"
          fi

      - name: Write result summary
        if: always()
        run: |
          {
            echo "## BMS checker result"
            echo ""
            echo "The script prints one explicit NOT AVAILABLE result when the requested date is absent from BookMyShow's date picker."
            echo ""
            echo "See the Run BMS Checker step for the per-target result and Telegram API response."
          } >> "$GITHUB_STEP_SUMMARY"

      # Save state file for next run
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bms_state.json
          key: bms-state-${{ github.ref }}-${{ github.run_id }}
